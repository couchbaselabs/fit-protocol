syntax = "proto3";

// See README.md in this directory for a description of these.
package protocol;
option csharp_namespace = "Couchbase.Grpc.Protocol";
option java_package = "com.couchbase.grpc.protocol";
option go_package = "github.com/couchbaselabs/transactions-fit-performer/protocol";
option java_multiple_files = true;

import "txn_commands.proto";
import "txn_hooks.proto";
import "txn_client_record.proto";
import "txn_cleanup.proto";
import "txn_extensions.proto";
import "txn_basic.proto";
import "txn_config.proto";
import "txn_legacy.proto";

// The driver provides the full transaction as a sequence of operations, which the performer executes.
service PerformerTransactionService {
    // Requests the performer's capabilities.
    // Added in ExtSDKIntegration, and should only be implemented in performers that support that.
    // If the performer has not implemented this, the driver will gracefully degrade to using the now-legacy
    // CreateConnectionRequest instead.
    rpc performerCapsFetch (PerformerCapsFetchRequest) returns (PerformerCapsFetchResponse);

    // Creates a Cluster connection, and optionally configures transactions on it.
    // Added in ExtSDKIntegration, and will only be sent if the performer declares support for that extension.  Otherwise
    // CreateConnectionRequest will be used.
    rpc clusterConnectionCreate (ClusterConnectionCreateRequest) returns (ClusterConnectionCreateResponse);

    // Close a particular cluster connection.
    // Added in ExtSDKIntegration, and will only be sent if the performer declares support for that extension.
    // There is no real analogue pre-ExtSDKIntegration, so all cluster connections will remain open.
    rpc clusterConnectionClose (ClusterConnectionCloseRequest) returns (ClusterConnectionCloseResponse);

    // Closes all cluster connections.
    // Since ExtSDKIntegrated, the driver should be cleaning up all resources it creates.  But this method remains useful
    // to send upfront before all tests, in case the previous run did not finish cleanly.
    // It can only be sent before or after all tests, to avoid destroying the default cluster connection.
    rpc disconnectConnections (DisconnectConnectionsRequest) returns (DisconnectConnectionsResponse);

    // Creates and runs a transaction and returns the result.
    // Abstracts over ExtSDKIntegration by passing both a clusterConnectionId and a transactionsFactoryRef so the
    // performer can use a Cluster or Transactions object as appropriate.  In ExtSDKIntegration, the transactionsFactoryRef
    // should be ignored.
    rpc transactionCreate (TransactionCreateRequest) returns (TransactionResult);

    // Closes all unclosed transaction factories.
    // ExtSDKIntegration performers should not implement this, and the driver will gracefully handle that.
    // The same comments for `disconnectConnections` apply.
    rpc closeTransactions (CloseTransactionsRequest) returns (CloseTransactionsResponse);

    // Transactions that can communicate bi-directionally with the tests
    // This is for more complex tests that require e.g. concurrent transactions, gating each other's progress.
    rpc transactionStream (stream TransactionStreamDriverToPerformer) returns (stream TransactionStreamPerformerToDriver);

    // Performs cleanup of a single transaction.  It will fetch the ATR entry first.
    // This tests the internals of the cleanup algo, the part shared by the two cleanup systems.
    rpc transactionCleanup (TransactionCleanupRequest) returns (TransactionCleanupAttempt);

    // Performs cleanup of a full ATR.  Useful for testing multiple performers concurrently cleaning up same ATR.
    // Note it will only cleanup expired entries.
    rpc transactionCleanupATR (TransactionCleanupATRRequest) returns (TransactionCleanupATRResult);

    // Fetches the set of collections currently being cleaned up.
    // Added in ExtSDKIntegration, and will only be sent if the performer declares support for that extension.
    rpc cleanupSetFetch (CleanupSetFetchRequest) returns (CleanupSetFetchResponse);

    // Request that the implementation do its normal client record processing logic (creating CR if needed).
    rpc clientRecordProcess (ClientRecordProcessRequest) returns (ClientRecordProcessResponse);

    // Perform a single query transaction.
    // Added in ExtSingleQuery, and will only be sent if the performer declares support for that extension.
    // Abstracts over ExtSDKIntegration by passing both a clusterConnectionId and a transactionsFactoryRef so the
    // performer can use a Cluster or Transactions object as appropriate.  In ExtSDKIntegration, the transactionsFactoryRef
    // should be ignored.
    rpc transactionSingleQuery (TransactionSingleQueryRequest) returns (TransactionSingleQueryResponse);

    // Request that the performer Echo a string to the performer logs.
    rpc echo (EchoRequest) returns (EchoResponse);



    // ExtSDKIntegration: the following methods will not be sent to ExtSDKIntegration-enabled performers.
    // Once we eventually end support for non-ExtSDKIntegration implementations, they will be removed.

    // Create or close a Transactions (e.g. a transactions factory), returning a transactionsFactoryRef.
    // Will be removed eventually as Transactions objects no longer really apply in ExtSDKIntegration - the Cluster is the 'lifecycle object'.
    // Performers that need to support non-ExtSDKIntegration will need to keep this, otherwise they can remove it.
    rpc transactionsFactoryCreate (TransactionsFactoryCreateRequest) returns (TransactionsFactoryCreateResponse);
    rpc transactionsFactoryClose (TransactionsFactoryCloseRequest) returns (TransactionGenericResponse);

    // The following can all be removed earlier, as soon as performers no longer use them.

    // Creates a clusterConnection between performer and Couchbase Server, and returns the performer caps.
    // Removed as ClusterConnectionCreateRequest does the job better, and has a proper close method.
    // Performers can implement clusterConnectionCreate and remove support for this, including if they don't support ExtSDKIntegration yet.
    rpc createConnection (CreateConnectionRequest) returns (CreateConnectionResponse) {
        option deprecated = true;
    };

    // Request a Transactions object forces cleanup of all requests on its queue.
    // This was removed as it's quite niche, used by very few tests, almost redundant since ExtRemoveComplete, and requires
    // backdoor access into cleanup.  It will no longer be sent and performers should remove it.
    rpc transactionProcessCleanupQueue (TransactionProcessCleanupQueueRequest) returns (TransactionCleanupQueueResult) {
        option deprecated = true;
    };

    // Request that the implementation remove this client from the client record, from all buckets.
    // This was removed as it's quite niche, used by very few tests, and requires backdoor access into cleanup.  And its
    // behaviour can be easily replicated with clusterConnectionClose/transactionsFactoryClose, which will remove the
    // client record everywhere too.  Performers can remove this, the driver will no longer send it.
    rpc clientRecordRemove (ClientRecordRemoveRequest) returns (ClientRecordRemoveResponse) {
        option deprecated = true;
    };
}

message PerformerCapsFetchRequest {
}

message PerformerCapsFetchResponse {
    // The capabilities of this performer and implementation-under-test.
    repeated PerformerCaps performerCaps = 1;

    // Human-readable string identifying the performer.  For example, "java".
    // ExtSDKIntegration: performers should use a new user agent to disambiguate, such as "java" and "java-sdk".
    string performerUserAgent = 2;

    // Identifies the version of the library under test.  For example, "1.1.2".
    string performerLibraryVersion = 4;

    // Defined https://hackmd.io/foGjnSSIQmqfks2lXwNp8w#Protocol-Versions
    // Must be "1.0", "2.0" or "2.1" any other values will cause the driver to abort.
    string protocolVersion = 3;

    // The APIs this implementation supports.  This is primarily used to run tests on multiple APIs, so if an implementation
    // only supports one, it should just return one - see comments for `API` for details.
    // If the performer does not return anything, it will be assumed to support just API.DEFAULT.
    repeated API supportedApis = 6;
}

// Only sent to ExtSDKIntegration-supporting performers.
// Creates a cluster connection, with an optional cluster & transactions configuration.
message ClusterConnectionCreateRequest {
    // The id to use for this connection.
    string clusterConnectionId = 1;

    // Details of the cluster connection.
    string clusterHostname = 2;
    string clusterUsername = 3;
    string clusterPassword = 4;

    optional ClusterConfig clusterConfig = 5;
}

message ClusterConnectionCreateResponse {
    // The number of cluster connections the performer has, after opening this one.
    int32 clusterConnectionCount = 1;
}

message ClusterConnectionCloseRequest {
    string clusterConnectionId = 1;
}

message ClusterConnectionCloseResponse {
    // The number of cluster connections the performer has, after closing this one.
    int32 clusterConnectionCount = 2;
}

message TransactionStartRequest {
}

message EchoRequest {
    string message = 1;
    string testName = 2;
}

message EchoResponse {
}

message TransactionStreamDriverToPerformer {
    oneof request {
        // This will setup a TwoWayTransaction but not start it.
        // Must only be one of these per stream..
        TransactionCreateRequest create = 1;

        // Starts a previously setup TwoWayTransaction
        // Only one of these will be sent per stream, and it will be after the TransactionCreateRequest.
        TransactionStartRequest start = 2;

        // A request broadcast from another TwoWayTransaction, that is being broadcast to the rest via the driver.
        BroadcastToOtherConcurrentTransactionsRequest broadcast = 3;
    }
}

// This will be propagated to other concurrent transactions, e.g. it can be used for
//  gating and communicating between concurrent transactions
message BroadcastToOtherConcurrentTransactionsRequest {
    oneof request {
        // Countdown a latch
        CommandSetLatch latchSet = 2;
    }
}

message TransactionCreated {
}

message TransactionStreamPerformerToDriver {
    oneof response {
        // The transaction is completed, and the stream is done
        TransactionResult finalResult = 1;

        // The transaction has been created e.g. as result of a TransactionCreateRequest, and is now ready
        // to start e.g. a TransactionStartRequest
        TransactionCreated created = 2;

        BroadcastToOtherConcurrentTransactionsRequest broadcast = 3;
    }
}

message TransactionCreateResponse {
    string transactionRef = 1;
}

message TransactionGenericResponse {
}

// The result of closing a transaction: whether the transaction succeeded, its logs,
// any exception thrown...
message TransactionResult {
    // With CBD-3802 this is now only checked for the Java performer, other implementations should not provide this.
    // It will eventually be removed.
    repeated MutationToken mutationTokens=1 [deprecated=true];

    // Next three fields are all now deprecated.  They are no longer used by FIT and performers do not need to return them.
    // They will eventually be removed.
    repeated TransactionAttempt attempts=2 [deprecated=true];
    string atrCollection=3 [deprecated=true];
    string atrId=4 [deprecated=true];

    // Any TransactionFailed error raised by the operation.
    TransactionException exception=5;

    // The cause field from any TransactionFailed error.
    ExternalException exceptionCause=10;

    // The implementation's in-memory log.  It's optional but helps greatly with debugging.
    repeated string log=6;

    string transactionId=7;

    // How many attempts need to be cleaned up, as a direct result of this transaction.
    // This field is only valid if cleanupClientAttempts was set (transactions will not queue a cleanup attempt if
    // there is nothing to handle it)
    int32 cleanupRequestsPending = 8;

    // Whether the cleanupRequestsPending field is valid, e.g. whether it can be checked
    bool cleanupRequestsValid = 9;

    bool unstagingComplete = 11;

    // Allows the performer to flag implementation/platform-specific validation failures that cannot be handled generically.
    // E.g. if an erroneous event is detected it can be returned here.
    // If present, the driver will fail the test, logging this message.
    optional string performerSpecificValidation = 12;

    // As of ExtSDKIntegration, this is deprecated, and the performer no longer needs to return it - it will be ignored.
    // It's somewhat unclear why it was here in the first place.  Appears to be used for creating a TransactionCleanupRequest,
    // but that can use any clusterConnectionId, including the default.
    string clusterConnectionId = 13 [deprecated=true];
}

// Note these latches don't work like real CountdownLatches (or equivalent).
// Each concurrent transaction gets its own version of the latch, and they are synchronized by the driver.
message Latch {
    int32 initialCount = 1;
    string name = 2;
}

// Initiates a single transaction.
message TransactionCreateRequest {
    // Non-ExtSDKIntegration: A reference to a previously constructed Transactions object (e.g. factory).
    // ExtSDKIntegration: ignore this (it will not be sent), and just use `clusterConnectionId` to get `cluster.transactions()`.
    optional string transactionsFactoryRef = 1;

    // A transaction can consist of multiple attempts.  Usually we want each attempt to do the same thing,
    // but there are a handful of tests where we need more complex logic and need to do different things
    // on different attempts.
    // If the transaction does more attempts than are in this field, the commands in the last attempt are
    // what will be repeated.
    repeated TransactionAttemptRequest attempts = 2;

    optional TransactionOptions options = 3;

    // Any latches that the transaction should create.
    repeated Latch latches = 4;

    // Just for debugging, name the test
    string name = 5;

    // Instead of the performer returning any raised events, the driver specifies which are expected, or explicitly
    // not expected.
    // Event buses can be asynchronous so this prevents the performer having to wait for an unknown amount of
    // time on each test.
    // Also, each implementation handles events differently - some use an event bus, some simply log.  So this allows
    // the performer to also check as appropriate.
    // For expectedAbsenceOfEvents, the performer should pick an appropriate amount of time to wait for events before
    // deciding an event will definitely not arrive.
    repeated Event expectedEvents = 6;
    repeated Event expectedAbsenceOfEvents = 9;

    // Instead of the performer returning any raised events, the driver specifies which are explicitly not expected.
    // Event buses can be asynchronous so this prevents the performer having to wait for an unknown amount of
    // time on each test.

    // Used for ExtSDKIntegration to create the transaction, and both in that and in non-ExtSDKIntegration to access
    // collections for KV operations.
    string clusterConnectionId = 7;

    // The API to use for this transaction.  See the comments for `API`.
    API api = 8;
}

message TransactionAttemptRequest {
    repeated TransactionCommand commands = 1;
}

// Runs a single query transaction (tximplicit).
// ExtSDKIntegration:     cluster.query()
// Non-ExtSDKIntegration: transactions.query()
message TransactionSingleQueryRequest {
    // A reference to a previously constructed Transactions object (e.g. factory).
    // Not sent to ExtSDKIntegration performers.
    optional string transactionsFactoryRef = 1;

    // A reference to a previously constructed cluster connection.
    // Will always be sent, but is only used by ExtSDKIntegration performers.
    string clusterConnectionId = 2;

    // The query to run
    CommandQuery query = 3;

    // Config needs handling differently in the performer based on ExtSDKIntegration or not.  The structure of these
    // messages is based around how things work in ExtSDKIntegration, and need some finangling for non-ExtSDKIntegration
    // performers.
    //
    // ExtSDKIntegration:
    // - The user calls `(cluster|scope).query(String, queryOptions().asTransaction([SingleQueryTransactionOptions]))`.
    // - Everything in GRPC QueryOptions should be passed to an SDK QueryOptions.
    // - The nested GRPC SingleQueryTransactionOptions should be passed as the SDK SingleQueryTransactionOptions block on
    //   QueryOptions.asTransaction(), if it is present.  Otherwise call QueryOptions.asTransaction() with no args.
    //
    // Non-ExtSDKIntegration:
    // - The user calls `transactions().query([Scope], String, [SingleQueryTransactionConfig])`
    // - SDK SingleQueryTransactionConfig contains an SDK TransactionQueryOptions.  This should be populated from GRPC QueryOptions.
    // -- If no GRPC QueryOptions settings are specified, no SDK TransactionQueryOptions should be created.
    // -- The GRPC QueryOptions.timeout() field must be applied at the SDK SingleQueryTransactionConfig level instead.
    // - SDK SingleQueryTransactionConfig is populated from GRPC QueryOptions.SingleQueryTransactionOptions.
    // - GRPC SingleQueryTransactionOptions.metadataCollection can be ignored.  That was added in ExtSDKIntegration.
    optional QueryOptions queryOptions = 4;

    // The API to use for this transaction.  See the comments for `API`.
    API api = 8;
}

message TransactionSingleQueryResponse {
    // Deprecated as this was from the initial version of ExtSingleQuery, pre SDK-integration.
    // The replacement fields below are compatible with the SDK integration, when only a QueryResult (or
    // TransactionFailed-derived error) is going to be returned to the user.
    // If `result` is returned then FIT will validate that, else it will use the replacement fields.
    TransactionResult result = 1 [deprecated=true];

    // The fields below replace the deprecated `result`, which will ultimately be removed.

    // Any TransactionFailed error raised by the operation, at the point of performing the cluster.query()/transactions.query()
    TransactionException exception = 2;

    // If `exception` is NO_EXCEPTION_THROWN, then this is the exception raised at the point of performing the cluster.query()/transactions.query().
    //    e.g. this is how non-TransactionFailed errors are indicated.
    // Otherwise, it's the cause field of the TransactionFailed.
    ExternalException exceptionCause = 3;

    // Any TransactionFailed error raised by the operation, at the point of streaming the rows.
    TransactionException exceptionDuringStreaming = 4;

    // If `exceptionDuringStreaming` is NO_EXCEPTION_THROWN, then this is the exception raised while streaming the rows.
    //    e.g. this is how non-TransactionFailed errors are indicated.
    // Otherwise, it's the cause field of the TransactionFailed.
    ExternalException exceptionCauseDuringStreaming = 5;

    // The implementation's in-memory log.  It's optional (and not possible to return when the SDK integrated cluster.query()
    // succeeds), but helps greatly with debugging on failures.
    repeated string log = 6;

    // Allows the performer to flag implementation/platform-specific validation failures that cannot be handled generically.
    // E.g. if an erroneous event is detected it can be returned here.
    // If present, the driver will fail the test, logging this message.
    optional string performerSpecificValidation = 7;
}

message DisconnectConnectionsRequest {
}

message DisconnectConnectionsResponse {
}

// Creates a Transactions object, e.g. a transactions factory
message TransactionsFactoryCreateRequest {
    // The following fields are deprecated and replaced by the `config` field (which allows optional fields)
    // They will still be sent by FIT, but performers should remove them while implementing the breaking change for
    // ExtSDKIntegration
    Durability durability = 1 [deprecated=true];
    int32 expirationMillis = 2 [deprecated=true];
    bool cleanupLostAttempts = 4 [deprecated=true];
    bool cleanupClientAttempts = 5 [deprecated=true];
    int64 cleanupWindowMillis = 6 [deprecated=true];
    UnstagingMode unstagingMode = 7 [deprecated=true];
    Collection metadataCollection = 8 [deprecated=true];
    // Any hooks can only use HookPoints before the CLEANUP_* range
    repeated Hook hook = 3 [deprecated=true];

    // The Cluster to use for `Transactions.create()`
    string clusterConnectionId = 9;

    optional TransactionsConfig config = 10;
}

// Shuts down a previously created Transactions (factory)
message TransactionsFactoryCloseRequest {
    string transactionsFactoryRef = 1;
}
