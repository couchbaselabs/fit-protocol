syntax = "proto3";
option java_package = "com.couchbase.grpc.protocol";
option go_package = "github.com/couchbaselabs/transactions-fit-performer/protocol";

// Defined https://hackmd.io/foGjnSSIQmqfks2lXwNp8w#Protocol-Extensions
enum PerformerCaps {
    // This is mandatory if PROTOCOL_VERSION_2_0 or higher is sent.
    EXT_TRANSACTION_ID = 0;

    EXT_DEFERRED_COMMIT = 1;
    EXT_IMPROVED_TIMESTAMPS = 2;
}
