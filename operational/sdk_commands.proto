syntax = "proto3";

package protocol;
option csharp_namespace = "Couchbase.Grpc.Protocol";
option java_package = "com.couchbase.client.performer.grpc";
option go_package = "github.com/couchbaselabs/perf-sdk/protocol";
option java_multiple_files = true;

import "sdk_options.proto";
import "doc_location.proto";
import "bounds.proto";
import "content.proto";
import "exceptions.proto";


message SdkCommandInsert {
  DocLocation location = 1;
  Content content = 2;
  optional InsertOptions options = 3;
}

message SdkCommandGet {
  DocLocation location = 1;
  optional GetOptions options = 2;
}

message SdkCommandRemove {
  DocLocation location = 1;
  optional RemoveOptions options = 2;
}

message SdkCommandReplace {
  DocLocation location = 1;
  Content content = 2;
  optional ReplaceOptions options = 3;
}

message SdkCommandUpsert {
  DocLocation location = 1;
  Content content = 2;
  optional UpsertOptions options = 3;
}

message SdkCommand {
  oneof command {
    SdkCommandInsert insert = 1;
    SdkCommandGet get = 2;
    SdkCommandRemove remove = 3;
    SdkCommandReplace replace = 4;
    SdkCommandUpsert upsert = 5;
  }

  // Whether the returned SdkCommandResult should contain a full result or just `success`.  Used for performance tests
  // when the result doesn't matter so the small cost of creating it can be eliminated.
  bool returnResult = 6;
}

message SdkMutationToken {
  // This is a short really, but GRPC doesn't have int16
  int32 partitionId = 1;
  int64 partitionUuid = 2;
  int64 sequenceNumber = 3;
  string bucketName = 4;
}

message SdkMutationResult {
  int64 cas = 1;
  optional SdkMutationToken mutationToken = 2;
}

message SdkGetResult {
  int64 cas = 1;
  bytes content = 2;
  // Represented as the number of seconds since January 1, 1970 (e.g. what the server returns)
  optional int64 expiryTime = 3;
}

message SdkWorkload {
  // The commands to run.  The performer should execute these in a loop until `bounds` is completed.
  //
  // If there are multiple commands, each should register as separate command for the purposes of bounding, and each
  // should send back one SdkCommandResult.
  //
  // For example, if the bounds specifies
  // to run 10 commands total, and there are 3 SdkCommand specified here, the performer should execute the 3 commands
  // 3 times, and then the first command once more.  And 10 SdkCommandResults will be sent back.
  //
  // If the command fails, the performer should not propagate the failure (but should still send back an SdkCommandResult).
  repeated SdkCommand command = 1;

  // Controls how the commands should be run.
  Bounds bounds = 2;
}


// The result of executing a single SdkCommand.
message SdkCommandResult {
  oneof result {
    // If the small overhead of creating a full *Result is not required (e.g. for performance testing), can
    // return this generic success instead.  Controlled by SdkCommand.returnResult.
    bool success = 1;

    // If the operation failed.
    Exception exception = 2;

    // If the operation succeeded and SdkCommand.returnResult==true, return one of these.
    SdkGetResult getResult = 3;
    SdkMutationResult mutationResult = 4;
  }
}

